name: Beginner quarterly simulation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    name: Matched quarterly simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run quarterly simulation pilot
        run: |
          mkdir -p artifacts
          node experiments/beginner-historical-pilot-v1/run-quarterly-simulation.mjs > artifacts/beginner-quarterly-simulation.json
      - name: Upload quarterly simulation result
        uses: actions/upload-artifact@v4
        with:
          name: beginner-quarterly-simulation
          path: artifacts/beginner-quarterly-simulation.json
