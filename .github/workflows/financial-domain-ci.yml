name: Financial domain CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  financial-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run financial domain tests
        run: node --test test/financial-domain.test.mjs

      - name: Check financial domain syntax
        shell: bash
        run: |
          for file in src/domain/financial/*.mjs test/financial-domain.test.mjs; do
            node --check "$file"
          done

      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
