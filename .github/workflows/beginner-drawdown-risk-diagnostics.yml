name: Beginner drawdown risk diagnostics

on:
  pull_request:
    paths:
      - 'validation/historicalRiskDiagnostics.js'
      - 'validation/historicalRiskDiagnostics.test.js'
      - 'experiments/beginner-etf-proxy-validation-v1/**'
      - 'experiments/beginner-historical-pilot-v1/**'
      - '.github/workflows/beginner-drawdown-risk-diagnostics.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diagnostic unit tests
        run: node --test validation/historicalRiskDiagnostics.test.js
      - name: Run annual historical risk diagnostics
        run: node experiments/beginner-etf-proxy-validation-v1/run-risk-diagnostics.mjs
      - name: Run quarterly drawdown frequency diagnostics
        run: node experiments/beginner-historical-pilot-v1/run-quarterly-risk-diagnostics.mjs
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beginner-drawdown-risk-diagnostics-v1
          path: |
            artifacts/beginner-drawdown-risk-diagnostics-v1.json
            artifacts/beginner-quarterly-drawdown-frequency-diagnostics-v1.json
          if-no-files-found: error
