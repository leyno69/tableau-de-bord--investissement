name: Daily investor lab

on:
  schedule:
    - cron: '25 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-investor-lab
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run daily cohort valuation
        env:
          LEYNOR_LAB_SNAPSHOT_URL: https://tableau-de-bord-investissement.vercel.app/api/lab-snapshot
        run: node scripts/run-daily-investor-lab.mjs
      - name: Persist results
        run: |
          git config user.name "leynor-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/investor-lab
          if git diff --cached --quiet; then
            echo "No new result"
          else
            git commit -m "data(lab): record daily investor cohort"
            git push
          fi
