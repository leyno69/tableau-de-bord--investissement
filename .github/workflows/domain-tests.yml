name: Domain tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 20
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project
        run: npm install --ignore-scripts

      - name: Run domain tests
        run: npm test
