<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord d'investissement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tableau de bord d'investissement</h1>

    <section>
        <h2>Vue d'ensemble</h2>
        <p>Bienvenue sur votre tableau de bord personnel.</p>
    </section>

<section>
    <h2>Portefeuille</h2>

   <div class="portfolio-form">

    <div class="form-field">
        <label for="nomAction">Entreprise</label>
        <input type="text" id="nomAction" placeholder="Ex. NVIDIA">
    </div>

    <div class="form-field">
        <label for="ticker">Ticker</label>
        <input type="text" id="ticker" placeholder="Ex. NVDA">
    </div>

    <div class="form-field">
    <label for="prixAchat">Prix d’achat moyen (€)</label>
    <input type="number" id="prixAchat" value="0" step="0.01">
</div>

    <div class="form-field">
        <label for="quantite">Nombre d’actions</label>
        <input type="number" id="quantite" value="0" step="0.0001">
    </div>

    <button id="ajouterPosition">Ajouter la position</button>

</div>

    <div id="listePositions"></div>

    <hr>

    <p><strong>Total investi :</strong> <span id="totalInvesti">0,00 €</span></p>
    <p><strong>Valeur totale :</strong> <span id="totalValeur">0,00 €</span></p>
    <p><strong>Gain / Perte total :</strong> <span id="totalGain">0,00 €</span></p>
    <p><strong>Rendement total :</strong> <span id="totalRendement">0,00 %</span></p>
</section>

    <section>
        <h2>Radar quotidien</h2>
        <p>Cette section affichera les actualités importantes des marchés.</p>
    </section>

<script src="script.js"></script> 
</body>
</html>
