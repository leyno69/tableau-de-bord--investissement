<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord d'investissement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tableau de bord d'investissement</h1>

    <section>
        <h2>Vue d'ensemble</h2>
        <p>Bienvenue sur votre tableau de bord personnel.</p>
    </section>

    <section>
    <h2>Portefeuille</h2>

    <label for="investi">Montant investi (€)</label>
    <input type="number" id="investi" value="0" step="0.01">

    <label for="valeur">Valeur actuelle (€)</label>
    <input type="number" id="valeur" value="0" step="0.01">

    <p><strong>Gain / Perte :</strong> <span id="gain">0 €</span></p>
    <p><strong>Rendement :</strong> <span id="rendement">0 %</span></p>
</section>

    <section>
        <h2>Radar quotidien</h2>
        <p>Cette section affichera les actualités importantes des marchés.</p>
    </section>

<script src="script.js"></script> 
</body>
</html>
