<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#102c46" />
  <title>LEYNOR — Hors connexion</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f6f3ec; color: #102c46; }
    main { width: min(520px, 100%); padding: 38px; border: 1px solid rgba(16,44,70,.12); border-radius: 28px; background: #fff; box-shadow: 0 24px 70px rgba(16,44,70,.12); }
    .mark { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 20px; background: #102c46; color: #f6f3ec; font-size: 2rem; font-weight: 800; }
    h1 { margin: 24px 0 10px; font-size: clamp(2rem, 7vw, 3rem); }
    p { margin: 0; line-height: 1.65; color: #526272; }
    button { margin-top: 28px; padding: 13px 18px; border: 0; border-radius: 14px; background: #102c46; color: white; font: inherit; font-weight: 750; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">L</div>
    <h1>Connexion interrompue</h1>
    <p>LEYNOR reste accessible avec les informations déjà enregistrées sur cet appareil. Reconnectez-vous pour actualiser les cours et interroger l’assistant.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
