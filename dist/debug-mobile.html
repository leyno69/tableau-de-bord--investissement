<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LEYNOR — Diagnostic mobile</title>
  <style>
    :root{color-scheme:dark}body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#f5f8fc}h1{font-size:1.35rem}p{color:#a8b6c9;line-height:1.5}.card{margin:14px 0;padding:14px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:#0d1929}.ok{color:#68d6a5}.bad{color:#ff7f8e}.pending{color:#e9c46a}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem}.actions{display:grid;gap:10px}.actions button{padding:13px;border:0;border-radius:12px;font-weight:700;background:#7ce6c3;color:#07111f}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08)}.row:last-child{border-bottom:0}</style>
</head>
<body>
  <h1>Diagnostic mobile LEYNOR</h1>
  <p>Cette page teste directement les ressources de production sans dépendre de l’interface principale.</p>
  <div class="actions"><button id="run">Relancer les tests</button><button id="copy">Copier le rapport</button></div>
  <section class="card"><strong>Résumé</strong><div id="summary" class="pending">Tests en cours…</div></section>
  <section class="card"><strong>Ressources</strong><div id="results"></div></section>
  <section class="card"><strong>Erreurs JavaScript</strong><pre id="errors">Aucune erreur capturée.</pre></section>
<script>
const resources=['/ready','/index.html','/app.js','/mobile-ui.js','/storage-bootstrap.js','/storage-schema.js','/boot-diagnostics.js','/interaction-audit.js','/diagnostics-panel.js','/assistant-ui.js','/server-sync.js','/broker-import.js'];
const errors=[];
addEventListener('error',e=>{errors.push(`${e.message} @ ${e.filename||'inconnu'}:${e.lineno||0}:${e.colno||0}`);renderErrors()});
addEventListener('unhandledrejection',e=>{errors.push(`Promise rejetée: ${e.reason?.stack||e.reason||'raison inconnue'}`);renderErrors()});
function renderErrors(){document.querySelector('#errors').textContent=errors.length?errors.join('\n\n'):'Aucune erreur capturée.'}
async function check(path){
  const started=performance.now();
  try{
    const response=await fetch(`${path}?diag=${Date.now()}`,{cache:'no-store'});
    const type=response.headers.get('content-type')||'inconnu';
    const text=await response.text();
    return {path,ok:response.ok,status:response.status,type,size:text.length,ms:Math.round(performance.now()-started)};
  }catch(error){return {path,ok:false,status:'réseau',type:'-',size:0,ms:Math.round(performance.now()-started),error:String(error)}}
}
async function run(){
  const root=document.querySelector('#results');
  const summary=document.querySelector('#summary');
  root.innerHTML='';summary.className='pending';summary.textContent='Tests en cours…';
  const results=[];
  for(const path of resources){
    const result=await check(path);results.push(result);
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<span>${path}<br><small>${result.type} · ${result.size} octets · ${result.ms} ms</small></span><strong class="${result.ok?'ok':'bad'}">${result.status}</strong>`;
    root.append(row);
  }
  const failed=results.filter(item=>!item.ok);
  window.__LEYNOR_MOBILE_DIAGNOSTIC__={at:new Date().toISOString(),userAgent:navigator.userAgent,location:location.href,results,errors};
  summary.className=failed.length?'bad':'ok';
  summary.textContent=failed.length?`${failed.length} ressource(s) en échec.`:'Toutes les ressources essentielles répondent.';
}
document.querySelector('#run').addEventListener('click',run);
document.querySelector('#copy').addEventListener('click',async()=>{
  const report=JSON.stringify(window.__LEYNOR_MOBILE_DIAGNOSTIC__||{errors},null,2);
  try{await navigator.clipboard.writeText(report);alert('Rapport copié.')}catch{prompt('Copie manuelle du rapport :',report)}
});
run();
</script>
</body>
</html>
