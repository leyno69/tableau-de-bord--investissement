<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réinitialisation LEYNOR</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#07111f; color:#f5f8fc; display:grid; place-items:center; min-height:100vh; margin:0; padding:24px; }
    main { max-width:520px; text-align:center; }
    p { color:#a9b8c9; line-height:1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Réinitialisation de LEYNOR…</h1>
    <p>Le cache navigateur et le service worker sont supprimés. Vos données locales sont conservées.</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }
      } finally {
        location.replace('/?reset=' + Date.now());
      }
    })();
  </script>
</body>
</html>
